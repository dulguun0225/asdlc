# CI for the spec-kit bundle in tools/spec-kit-bundle/.
#
# WHY THIS FILE EXISTS AT THE ROOT: GitHub runs workflows only from the
# repository root `.github/workflows/`. A workflow under tools/ would be inert,
# so the bundle keeps no copy of this file. THIS IS THE ONLY COPY. Delete it
# and the bundle silently loses its CI.
#
# Three differences from a workflow living inside the bundle, and nothing else:
#   1. `paths` filters, so a change to the design does not install the
#      spec-kit CLI and run an end-to-end probe.
#   2. `defaults.run.working-directory`, which fixes every relative path.
#   3. $BUNDLE_DIR, because `working-directory` does not help the steps that
#      `cd /tmp/proj` first and then reach back with an absolute path.
#
# Retargeted on 2026-08-05 (ADR-0028) from the pre-rename layout: the bundle
# directory, both component ids, and the component count all changed, and the
# extension the bundle used to ship is gone.
#
# Narrowed the same day (ADR-0029): check_specs.py and its examples/ left the
# bundle, so the --self step and the three negative probes MOVED to
# spec-kit-checker-checks.yml. They were relocated, not deleted — the rule
# below against deleting a probe holds in full, and that workflow is where
# they now hold it.

name: bundle-checks

on:
  push:
    paths:
      - 'tools/spec-kit-bundle/**'
      - '.github/workflows/bundle-checks.yml'
  pull_request:
    paths:
      - 'tools/spec-kit-bundle/**'
      - '.github/workflows/bundle-checks.yml'

env:
  SPECKIT_PIN: v0.14.2
  BUNDLE_DIR: ${{ github.workspace }}/tools/spec-kit-bundle

defaults:
  run:
    working-directory: tools/spec-kit-bundle

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned specify CLI
        run: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@${{ env.SPECKIT_PIN }}
      # --offline: structural checks still run in full; the two `asdlc`
      # component references (the preset and the workflow) cannot resolve from
      # CI — they live in this repo, not in any catalog reachable here — which
      # offline downgrades to warnings instead of errors. Two warnings, one per
      # component; the bundle ships no extension.
      - name: Validate bundle manifest
        run: specify bundle validate --path . --offline

      # This job held six more steps until 2026-07-30 — a failing `Pack
      # structure` gate over `packs/`, its three negative probes, and an
      # advisory freshness tripwire. `packs/` was deleted that day and
      # `ci/check_packs.py` with it, so all five went too. They are NOT an
      # example of the "never delete a probe to make CI pass" rule being
      # broken: that rule protects a probe whose checker still exists. There is
      # no checker and nothing to check.
      #
      # The sixth, `check_specs.py --self`, went to spec-kit-checker-checks.yml
      # on 2026-08-05 with the program it runs.

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned specify CLI
        run: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@${{ env.SPECKIT_PIN }}

      - name: Install the bundle into a fresh project (local flow)
        run: |
          # The default shell here is `bash -e`, not `bash -eo pipefail`, so
          # the install's exit code would be lost through the `tee` below.
          set -o pipefail
          mkdir -p /tmp/proj && cd /tmp/proj
          git init -q
          git config user.email ci@example.com && git config user.name ci
          specify init --here --force --integration claude --script sh --ignore-agent-tools
          specify preset add    --dev "$BUNDLE_DIR/presets/asdlc"
          specify workflow add  --dev "$BUNDLE_DIR/workflows/asdlc"
          # Assert the report text: both components must resolve from the
          # --dev installs above. "1 added" would mean the bundler reinstalled
          # something from elsewhere; a failure line would mean it resolved
          # neither. `tee` keeps the output in the log.
          specify bundle install "$BUNDLE_DIR/bundle.yml" --offline | tee /tmp/install.txt
          grep -q '0 added, 2 already present' /tmp/install.txt

      - name: Composed commands are real compositions, not placeholders
        run: |
          cd /tmp/proj
          if grep -rl '{CORE_TEMPLATE}' .claude/skills/; then
            echo 'unexpanded {CORE_TEMPLATE} in a composed skill'; exit 1
          fi
          grep -q 'EARS' .claude/skills/speckit-specify/SKILL.md
          grep -q 'Requirements Traceability' .claude/skills/speckit-plan/SKILL.md
          grep -q 'FR-nnn' .claude/skills/speckit-tasks/SKILL.md
          grep -q 'Constitution guard' .claude/skills/speckit-constitution/SKILL.md

      # The bundle ships no extension, so nothing gates implementation. This is
      # a positive assert on that absence: an extension re-added without also
      # restoring the release workflow's extension asserts would ship
      # unvalidated, and the pre-rename version of this job asserted the
      # opposite. Delete this step only together with the CLAUDE.md rule 2 that
      # records the removal.
      - name: The bundle installs no extension and gates nothing
        run: |
          cd /tmp/proj
          # Whether `specify init` writes an empty .specify/extensions.yml is
          # not verified, so check its CONTENT rather than its existence: no
          # hook may be registered.
          if [ -f .specify/extensions.yml ] && grep -qE 'before_implement|after_implement' .specify/extensions.yml; then
            echo 'a hook is registered — the bundle installed an extension'; cat .specify/extensions.yml; exit 1
          fi
          if ls .claude/skills/ | grep -q '^speckit-asdlc-'; then
            echo 'an extension command skill was installed'; exit 1
          fi

      - name: Workflow is installed and carries its two gates
        run: |
          cd /tmp/proj
          test -f .specify/workflows/asdlc/workflow.yml
          grep -q '"asdlc"' .specify/workflows/workflow-registry.json
          test "$(grep -c 'type: gate' .specify/workflows/asdlc/workflow.yml)" = 2
          # review-spec sits between specify and plan; review-plan between plan
          # and tasks. Nothing gates implement.
          awk '/id: specify/{s=NR} /id: review-spec/{rs=NR} /id: plan/{p=NR} /id: review-plan/{rp=NR} /id: tasks/{t=NR} END{exit !(s<rs && rs<p && p<rp && rp<t)}' .specify/workflows/asdlc/workflow.yml

      - name: Scaffolded artifacts are composed, not placeholders
        run: |
          cd /tmp/proj
          .specify/scripts/bash/create-new-feature.sh --json "smoke test feature"
          .specify/scripts/bash/setup-plan.sh --json
          if grep -rl '{CORE_TEMPLATE}' specs/; then
            echo 'unexpanded {CORE_TEMPLATE} in a scaffolded artifact'; exit 1
          fi
          grep -q 'EARS' specs/001-smoke-test-feature/spec.md
          # The scaffolded spec carried `**Status**: Draft` until the
          # 2026-08-05 reset removed it with the rest of the gate. Nothing
          # replaced it: the template has no status line at all now, so there
          # is nothing here to assert in its place.

      # Three negative probes for `check_specs.py` sat here until 2026-08-05.
      # They moved to spec-kit-checker-checks.yml with the checker (ADR-0029),
      # where they run against the same fixture with no spec-kit CLI to
      # install. This workflow no longer references that program at all.
