# Release workflow for the spec-kit bundle in tools/spec-kit-bundle/.
#
# WHY THIS FILE EXISTS AT THE ROOT: GitHub runs workflows only from the
# repository root `.github/workflows/`. A workflow under tools/ would be inert,
# so the bundle keeps no copy of this file. THIS IS THE ONLY COPY. Delete it
# and the bundle has no release path.
#
# Four differences from a workflow living inside the bundle, and nothing else:
#   1. The trigger is `bundle-v*`, not `v*`. This repository also holds the
#      ASDLC design, so a bare `v1.0.0` cut for the design must not publish a
#      bundle release.
#   2. The tag/version assert compares against `bundle-v$BUNDLE_V`.
#   3. `defaults.run.working-directory`, which fixes every relative path.
#   4. $BUNDLE_DIR, because the zip steps `cd` into a component directory and
#      then reach back with an absolute path — and $GITHUB_WORKSPACE is the
#      repository root here, not the bundle.
#
# THIS WORKFLOW HAS NEVER RUN. GitHub Actions cannot be exercised from a
# workstation, and the first real run is the proof.
#
# Retargeted on 2026-08-05 (ADR-0028) for the renamed and reset bundle: the
# bundle directory, every component id, and every release asset name changed,
# and the extension the bundle used to ship is gone — its three asserts and
# its zip step went with it. The asserts that remain were NOT re-dry-run after
# the retarget.
#
# The asserts check that the tag is pinned CONSISTENTLY across the catalogs,
# never that the resulting URLs RESOLVE — they cannot, until this workflow
# creates the release they point at. Check all three by hand after the first
# release. This repository is public by decision (ADR-0027), so consumers need
# no credential; see the bundle's README, "Org distribution".

name: bundle-release

on:
  push:
    tags: ['bundle-v*']

permissions:
  contents: write

env:
  SPECKIT_PIN: v0.14.2
  BUNDLE_DIR: ${{ github.workspace }}/tools/spec-kit-bundle

defaults:
  run:
    working-directory: tools/spec-kit-bundle

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned specify CLI
        run: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@${{ env.SPECKIT_PIN }}

      # A tag can point at any commit, so re-run the gates here: a release
      # publishes to the org's distribution channel and must not skip them.
      - name: Validate before packaging
        run: |
          specify bundle validate --path . --offline
          python3 ci/check_specs.py --self

      - name: Tag must match the bundle version
        run: |
          BUNDLE_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' bundle.yml | head -1)
          [ -n "$BUNDLE_V" ] || { echo "could not extract version from bundle.yml" >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "bundle-v$BUNDLE_V" ] || {
            echo "tag $GITHUB_REF_NAME does not match bundle version $BUNDLE_V - the tag must be bundle-v$BUNDLE_V; bump bundle.yml (and catalogs/) or retag" >&2; exit 1; }

      # The workflow component ships as a raw file, not a zip: its catalog
      # entry must point at workflows/asdlc/workflow.yml at THIS tag, and
      # the advertised version must match the file (bundle install compares
      # the bundle.yml pin against the catalog-advertised version).
      #
      # The url assert matches the tag segment and the file path but not the
      # repository between them.
      - name: Workflow catalog entry must match the file and the tag
        run: |
          WF_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' workflows/asdlc/workflow.yml | head -1)
          [ -n "$WF_V" ] || { echo "could not extract version from workflows/asdlc/workflow.yml" >&2; exit 1; }
          grep -q "\"version\": \"$WF_V\"" catalogs/workflows.json || {
            echo "catalogs/workflows.json version does not match workflow.yml ($WF_V)" >&2; exit 1; }
          grep -A2 '^  workflows:' bundle.yml | grep -q "version: \"$WF_V\"" || {
            echo "bundle.yml workflow pin does not match workflow.yml ($WF_V)" >&2; exit 1; }
          grep -q "/$GITHUB_REF_NAME/.*workflows/asdlc/workflow.yml" catalogs/workflows.json || {
            echo "catalogs/workflows.json url must pin this tag ($GITHUB_REF_NAME)" >&2; exit 1; }

      # The zip catalogs embed version AND tag in every download_url; nothing
      # else checks them, so a stale entry would release green and point
      # consumers at a nonexistent asset.
      #
      # Asset names carry the component type — asdlc-preset-<v>.zip,
      # asdlc-bundle-<v>.zip — because preset, workflow and bundle all share
      # the id `asdlc` and a release has one flat asset namespace.
      - name: Preset and bundle catalog entries must match the manifests and the tag
        run: |
          PRESET_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' presets/asdlc/preset.yml | head -1)
          BUNDLE_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' bundle.yml | head -1)
          grep -q "\"version\": \"$PRESET_V\"" catalogs/presets.json || {
            echo "catalogs/presets.json version does not match preset.yml ($PRESET_V)" >&2; exit 1; }
          grep -q "download/$GITHUB_REF_NAME/asdlc-preset-$PRESET_V.zip" catalogs/presets.json || {
            echo "catalogs/presets.json download_url must be $GITHUB_REF_NAME/asdlc-preset-$PRESET_V.zip" >&2; exit 1; }
          grep -q "\"version\": \"$BUNDLE_V\"" catalogs/bundles.json || {
            echo "catalogs/bundles.json version does not match bundle.yml ($BUNDLE_V)" >&2; exit 1; }
          grep -q "download/$GITHUB_REF_NAME/asdlc-bundle-$BUNDLE_V.zip" catalogs/bundles.json || {
            echo "catalogs/bundles.json download_url must be $GITHUB_REF_NAME/asdlc-bundle-$BUNDLE_V.zip" >&2; exit 1; }

      # preset.yml ships at the root of its zip and is copied WHOLE into every
      # consumer project, so its `repository` field is the bundle's published
      # identity as a consumer sees it. ADR-0026 repointed the catalogs when
      # the bundle moved and missed this field, which is the failure that ADR
      # records: when a component moves, its published identity does not move
      # with it, and it is not in the files you edit. Nothing else checks it,
      # so a stale value would release green and install a pointer to an
      # archived, read-only repository.
      #
      # The second check is a directory sweep rather than a field check: it
      # catches ANY shipped file that names an archived repository, not just
      # the field known to have gone stale. `README.md` at the bundle root is
      # deliberately out of scope — it names the deleted standalone repository
      # on purpose, to say that it is gone.
      - name: Shipped component manifests must name the releasing repository
        run: |
          RELEASE_REPO="https://github.com/dulguun0225/asdlc"
          grep -q "^  repository: \"$RELEASE_REPO\"$" presets/asdlc/preset.yml || {
            echo "presets/asdlc/preset.yml repository must be $RELEASE_REPO - it ships into consumer projects (ADR-0026)" >&2; exit 1; }
          if grep -rnE 'dulguun0225/(spec-kit-bundle-nc|asdlc-archived)' presets/; then
            echo "the files above ship to consumers and name an archived, read-only repository; point them at $RELEASE_REPO" >&2; exit 1
          fi

      # Preset zip: preset.yml at the zip root, matching what
      # PresetManager.install_from_zip expects and the download_url filename in
      # catalogs/presets.json.
      #
      # $BUNDLE_DIR, not $GITHUB_WORKSPACE: `mkdir -p dist` runs in the bundle
      # directory via defaults.run.working-directory, so dist/ is there too.
      - name: Build preset zip
        run: |
          mkdir -p dist
          PRESET_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' presets/asdlc/preset.yml | head -1)
          [ -n "$PRESET_V" ] || { echo "could not extract version from presets/asdlc/preset.yml" >&2; exit 1; }
          (cd presets/asdlc && zip -r "$BUNDLE_DIR/dist/asdlc-preset-$PRESET_V.zip" . -x '.composed/*')

      # Bundle zip: `specify bundle build` requires bundle.yml + README.md and
      # zips the whole directory, so build from a staging dir to keep the
      # artifact minimal (install reads only bundle.yml anyway).
      #
      # It names the zip after the bundle id, which is `asdlc` — the same id
      # the preset uses. Build into a separate directory and rename into dist/
      # so the two assets do not collide and the name matches
      # catalogs/bundles.json.
      - name: Build bundle zip
        run: |
          BUNDLE_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' bundle.yml | head -1)
          mkdir -p stage dist bundle-out
          cp bundle.yml README.md stage/
          specify bundle build --path stage --output bundle-out
          COUNT=$(ls bundle-out/*.zip | wc -l)
          [ "$COUNT" = 1 ] || {
            echo "expected exactly one zip from bundle build, got $COUNT" >&2; ls -l bundle-out; exit 1; }
          mv bundle-out/*.zip "dist/asdlc-bundle-$BUNDLE_V.zip"

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "spec-kit bundle \`asdlc\`. See tools/spec-kit-bundle/README.md. Catalogs: tools/spec-kit-bundle/catalogs/*.json point at these assets."
