# CI for tools/feature-artifact-checker/ — today, the fork seed check_specs.py
# and the ADR-0035 state-model seed statemodel_to_mermaid.py.
#
# WHY THIS FILE EXISTS AT THE ROOT: GitHub runs workflows only from the
# repository root `.github/workflows/`. A workflow under tools/ would be inert,
# so the checker keeps no copy of this file. THIS IS THE ONLY COPY. Delete it
# and the checker silently loses its CI.
#
# A probe must go red for the right reason. The rewrite to the design's spec
# replaces the probes below with ones asserting the new failure modes;
# replacement lands with the behavior change it tests, never as a bare
# deletion.
#
# It installs nothing. check_specs.py is stdlib-only by rule, so the runner's
# python3 is the whole toolchain.

name: feature-artifact-checker-checks

on:
  push:
    paths:
      - 'tools/feature-artifact-checker/**'
      - '.github/workflows/feature-artifact-checker-checks.yml'
  pull_request:
    paths:
      - 'tools/feature-artifact-checker/**'
      - '.github/workflows/feature-artifact-checker-checks.yml'

defaults:
  run:
    working-directory: tools/feature-artifact-checker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Examples stay well-formed
        run: python3 check_specs.py --self

      - name: State-model seed stays green
        run: python3 statemodel_to_mermaid.py --self

      - name: Negative probe — a dead-end state and a malformed FR id turn the state-model seed red
        run: |
          printf '### State model\n\n*States:* A, B, C. *Initial:* A. *Terminal:* B.\n\n| From | Trigger | Guard | To | FR ids |\n|---|---|---|---|---|\n| A | go | — | B | FR-001 |\n| A | stray | — | C | FR-1 |\n' > /tmp/bad-model.md
          if python3 statemodel_to_mermaid.py --check-only /tmp/bad-model.md > /tmp/sm-out.txt 2>&1; then
            echo 'seed passed a dead-end state and a malformed FR id'; cat /tmp/sm-out.txt; exit 1
          fi
          grep -q 'dead end' /tmp/sm-out.txt
          grep -q 'not an FR-nnn id' /tmp/sm-out.txt

      # Negative probes: the checker must go red on a violation, and red for
      # the right reason. A green gate that cannot fail proves nothing.
      # Never delete one to make CI pass.
      #
      # Each builds a throwaway product repo from the worked example's spec.md
      # plus a hand-written plan/tasks, then asserts BOTH the non-zero exit and
      # the message text.
      - name: Negative probe — task without an FR reference turns the gate red
        run: |
          mkdir -p /tmp/bad-repo/specs/001-bad
          cp examples/password-reset/spec.md /tmp/bad-repo/specs/001-bad/spec.md
          printf '## Requirements Traceability\n\n| Requirement | Satisfied by |\n| --- | --- |\n| FR-001 | x |\n| FR-002 | x |\n| FR-003 | x |\n| FR-004 | x |\n| FR-005 | x |\n| FR-006 | x |\n| FR-007 | x |\n| FR-008 | x |\n| FR-009 | x |\n| FR-010 | x |\n\n## Decision Trace\n\n| Technical Context entry | Decision |\n| --- | --- |\n| Language | decisions/0001-language.md |\n' > /tmp/bad-repo/specs/001-bad/plan.md
          printf -- '- [ ] T001 Implement something in src/x.py\n' > /tmp/bad-repo/specs/001-bad/tasks.md
          if python3 check_specs.py --repo /tmp/bad-repo > /tmp/out.txt 2>&1; then
            echo 'checker passed a task with no [FR-nnn] reference'; cat /tmp/out.txt; exit 1
          fi
          grep -q 'carries no \[FR-nnn\] reference' /tmp/out.txt

      # `## Approval` was a required section until the 2026-08-05 reset removed
      # the bundle's gate; the checker no longer looks for it and this probe no
      # longer asserts it. The two sections below are the ones that remain.
      - name: Negative probe — plan without the appended sections turns the gate red
        run: |
          mkdir -p /tmp/bad-repo2/specs/001-bad
          cp examples/password-reset/spec.md /tmp/bad-repo2/specs/001-bad/spec.md
          printf '# Plan\n\nno sections here\n' > /tmp/bad-repo2/specs/001-bad/plan.md
          if python3 check_specs.py --repo /tmp/bad-repo2 > /tmp/out2.txt 2>&1; then
            echo 'checker passed a plan without the required sections'; cat /tmp/out2.txt; exit 1
          fi
          grep -q '## Requirements Traceability' /tmp/out2.txt
          grep -q '## Decision Trace' /tmp/out2.txt

      - name: Negative probe — a Decision Trace placeholder row turns the gate red
        run: |
          mkdir -p /tmp/bad-repo3/specs/001-bad
          cp examples/password-reset/spec.md /tmp/bad-repo3/specs/001-bad/spec.md
          printf '## Requirements Traceability\n\n| Requirement | Satisfied by |\n| --- | --- |\n| FR-001 | x |\n| FR-002 | x |\n| FR-003 | x |\n| FR-004 | x |\n| FR-005 | x |\n| FR-006 | x |\n| FR-007 | x |\n| FR-008 | x |\n| FR-009 | x |\n| FR-010 | x |\n\n## Decision Trace\n\n| Technical Context entry | Decision |\n| --- | --- |\n| Testing | <component, contract file, or plan section> |\n' > /tmp/bad-repo3/specs/001-bad/plan.md
          if python3 check_specs.py --repo /tmp/bad-repo3 > /tmp/out3.txt 2>&1; then
            echo 'checker passed a Decision Trace row with a placeholder'; cat /tmp/out3.txt; exit 1
          fi
          grep -q 'angle-bracket placeholder' /tmp/out3.txt
