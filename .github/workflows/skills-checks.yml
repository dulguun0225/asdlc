# CI for the skills/ tree and its harness in tools/skills-harness/.
#
# WHY THIS FILE EXISTS AT THE ROOT: GitHub runs workflows only from the
# repository root `.github/workflows/`. A workflow under skills/ or tools/
# would be inert, so neither directory keeps a copy. THIS IS THE ONLY COPY.
# Delete it and the skills silently lose their CI.
#
# Created 2026-08-05 with ADR-0033, when the skills moved into this repository.
# It runs the discovery check and the two wired gates. It does NOT run the
# firing harness (needs a logged-in `claude` CLI, spends real money, and is
# stochastic — the skills' own CLAUDE.md rules it out of gates) and does not
# run the token reports (reports, not gates).
#
# The discovery check is a gate here on purpose: a skill whose frontmatter
# fails to parse is not a skill at all to every consumer, and that defect was
# real — an unquoted `argument-hint: [.. ] [..]` made asdlc-implement invisible
# on this workflow's first local run.
#
# NOT YET RUN ON ACTIONS. Every step below passes locally; the first push that
# touches skills/ or tools/skills-harness/ is the proof.

name: skills-checks

on:
  push:
    paths:
      - 'skills/**'
      - 'tools/skills-harness/**'
      - '.github/workflows/skills-checks.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'tools/skills-harness/**'
      - '.github/workflows/skills-checks.yml'

defaults:
  run:
    working-directory: tools/skills-harness

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The exact pin from tools/skills-harness/mise.toml, for the reason
          # recorded there: two machines resolving a major differently shows up
          # as a toolchain behaviour change.
          node-version: '26.5.1'

      - name: Exact tool versions from the lockfile
        run: npm ci

      - name: Discovery — every skill parses and is visible to a consumer
        # `skills add ../.. --list` walks the repository root the way a
        # consumer's `skills add <owner>/<repo>` does. It exits zero even when
        # it skips a file it cannot parse, so the gate is the skip line: any
        # "Skipped ... SKILL.md" in the output is a skill no consumer gets.
        run: |
          npm run check 2>&1 | tee /tmp/discovery.txt
          if grep -q "Skipped" /tmp/discovery.txt; then
            echo "a SKILL.md was skipped by discovery - it is invisible to every consumer"; exit 1
          fi

      - name: Gates — evidence order and dangling pointers
        run: npm run gates
