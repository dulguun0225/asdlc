name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SPECKIT_PIN: v0.14.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned specify CLI
        run: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@${{ env.SPECKIT_PIN }}

      # A tag can point at any commit, so re-run the gates here: a release
      # publishes to the org's distribution channel and must not skip them.
      - name: Validate before packaging
        run: |
          specify bundle validate --path . --offline
          python3 ci/check_specs.py --self

      - name: Tag must match the bundle version
        run: |
          BUNDLE_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' bundle.yml | head -1)
          [ -n "$BUNDLE_V" ] || { echo "could not extract version from bundle.yml" >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$BUNDLE_V" ] || {
            echo "tag $GITHUB_REF_NAME does not match bundle version $BUNDLE_V - bump bundle.yml (and catalogs/) or retag" >&2; exit 1; }

      # The workflow component ships as a raw file, not a zip: its catalog
      # entry must point at workflows/nc-sdd/workflow.yml at THIS tag, and
      # the advertised version must match the file (bundle install compares
      # the bundle.yml pin against the catalog-advertised version).
      - name: Workflow catalog entry must match the file and the tag
        run: |
          WF_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' workflows/nc-sdd/workflow.yml | head -1)
          [ -n "$WF_V" ] || { echo "could not extract version from workflows/nc-sdd/workflow.yml" >&2; exit 1; }
          grep -q "\"version\": \"$WF_V\"" catalogs/workflows.json || {
            echo "catalogs/workflows.json version does not match workflow.yml ($WF_V)" >&2; exit 1; }
          grep -A2 '^  workflows:' bundle.yml | grep -q "version: \"$WF_V\"" || {
            echo "bundle.yml workflow pin does not match workflow.yml ($WF_V)" >&2; exit 1; }
          grep -q "spec-kit-bundle-nc/$GITHUB_REF_NAME/workflows/nc-sdd/workflow.yml" catalogs/workflows.json || {
            echo "catalogs/workflows.json url must pin this tag ($GITHUB_REF_NAME)" >&2; exit 1; }

      # The zip catalogs embed version AND tag in every download_url; nothing
      # else checks them, so a stale entry would release green and point
      # consumers at a nonexistent asset.
      - name: Preset/extension/bundle catalog entries must match the manifests and the tag
        run: |
          PRESET_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' presets/nc-ears/preset.yml | head -1)
          EXT_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' extensions/nc/extension.yml | head -1)
          BUNDLE_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' bundle.yml | head -1)
          grep -q "\"version\": \"$PRESET_V\"" catalogs/presets.json || {
            echo "catalogs/presets.json version does not match preset.yml ($PRESET_V)" >&2; exit 1; }
          grep -q "download/$GITHUB_REF_NAME/nc-ears-$PRESET_V.zip" catalogs/presets.json || {
            echo "catalogs/presets.json download_url must be $GITHUB_REF_NAME/nc-ears-$PRESET_V.zip" >&2; exit 1; }
          grep -q "\"version\": \"$EXT_V\"" catalogs/extensions.json || {
            echo "catalogs/extensions.json version does not match extension.yml ($EXT_V)" >&2; exit 1; }
          grep -q "download/$GITHUB_REF_NAME/nc-$EXT_V.zip" catalogs/extensions.json || {
            echo "catalogs/extensions.json download_url must be $GITHUB_REF_NAME/nc-$EXT_V.zip" >&2; exit 1; }
          grep -q "\"version\": \"$BUNDLE_V\"" catalogs/bundles.json || {
            echo "catalogs/bundles.json version does not match bundle.yml ($BUNDLE_V)" >&2; exit 1; }
          grep -q "download/$GITHUB_REF_NAME/nc-sdd-$BUNDLE_V.zip" catalogs/bundles.json || {
            echo "catalogs/bundles.json download_url must be $GITHUB_REF_NAME/nc-sdd-$BUNDLE_V.zip" >&2; exit 1; }

      # Component zips: preset.yml / extension.yml at the zip root, matching
      # what PresetManager/ExtensionManager.install_from_zip expects and the
      # download_url filenames in catalogs/*.json.
      - name: Build component zips
        run: |
          mkdir -p dist
          PRESET_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' presets/nc-ears/preset.yml | head -1)
          [ -n "$PRESET_V" ] || { echo "could not extract version from presets/nc-ears/preset.yml" >&2; exit 1; }
          EXT_V=$(sed -n 's/^  version: "\(.*\)"/\1/p' extensions/nc/extension.yml | head -1)
          [ -n "$EXT_V" ] || { echo "could not extract version from extensions/nc/extension.yml" >&2; exit 1; }
          (cd presets/nc-ears && zip -r "$GITHUB_WORKSPACE/dist/nc-ears-$PRESET_V.zip" . -x '.composed/*')
          (cd extensions/nc  && zip -r "$GITHUB_WORKSPACE/dist/nc-$EXT_V.zip" . -x '.composed/*')

      # Bundle zip: `specify bundle build` requires bundle.yml + README.md and
      # zips the whole directory, so build from a staging dir to keep the
      # artifact minimal (install reads only bundle.yml anyway).
      - name: Build bundle zip
        run: |
          mkdir -p stage
          cp bundle.yml README.md stage/
          specify bundle build --path stage --output dist

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Catalogs: catalogs/*.json point at these assets."
