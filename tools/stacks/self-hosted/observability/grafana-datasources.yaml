# Provisioned datasources (ADR-0015 §7): the same PromQL and LogQL the cloud
# variant's Grafana Cloud reads — dashboard JSON is portable across variants.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
