# The ring sweep. Trusted context; the Gerrit credential is this config
# project's secret and never reaches a proposed change.
- hosts: localhost
  vars:
    config_src: >-
      {{ zuul.executor.work_root }}/{{ (zuul.projects.values()
         | selectattr('short_name', 'equalto', 'zuul-config')
         | first).src_dir }}
  tasks:
    - name: Sweep open changes (assign ring reviewer; reassign on breach)
      command: >-
        /opt/stack-bin/node {{ config_src }}/scripts/ring-assign.mjs
        {{ config_src }}/ring.yaml {{ config_src }}/ring-contacts.yaml
      environment:
        GERRIT_URL: http://gerrit:8080
        GERRIT_USER: "{{ ring_gerrit.user }}"
        GERRIT_PASSWORD: "{{ ring_gerrit.password }}"
        OTLP_URL: http://172.17.0.1:4318
      # no_log censors the registered result entirely (runtime fact: a
      # follow-up debug of sweep.stdout_lines fails with "sequence was
      # empty"), so there is no output task: the sweep's visible record is
      # the reviewer updates in Gerrit and the breach records in Loki.
      no_log: true
