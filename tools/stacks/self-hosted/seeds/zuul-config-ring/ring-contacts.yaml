# Team-to-account resolution for THIS rig — bring-up wiring the design's
# schema deliberately does not fix (an org holds it in its directory). The
# ring job resolves a team to the Gerrit username of its AI solution
# engineer here. Teams without an entry cannot be assigned to — the job
# reports them rather than skipping silently.
#
# Rig cast: engineer produces on team-01; with offset 5 the ring reviewer is
# team-06 (cft-lead) and the breach reassignment target is team-11
# (platform-owner-backup).
version: 1
contacts:
  team-01: engineer
  team-06: cft-lead
  team-11: platform-owner-backup
