# The ring + reassignment job (the sheet's last build row) on a timer. The
# periodic pipeline fires the assignment sweep; the job runs trusted on the
# executor with the CI identity's Gerrit credential.
- pipeline:
    name: periodic
    description: Timer-driven maintenance jobs.
    manager: independent
    trigger:
      timer:
        - time: "*/5 * * * *"

- job:
    name: ring-assign
    description: |
      ADR-0005 §4–5: ensure the ring reviewer (team i+k) sits on every open
      change; on a same-working-day SLA breach with no ring vote, add team
      i+2k and record {change, from, to, breached_at} to the observability
      store. Reassignment, never a queue.
    parent: null
    nodeset:
      nodes: []
    run: playbooks/ring/assign.yaml
    required-projects:
      - zuul-config
    secrets:
      - name: ring_gerrit
        secret: ring-gerrit

- project:
    name: zuul-config
    periodic:
      jobs:
        - ring-assign
