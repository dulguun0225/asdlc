# The base job, quickstart jobs2 shape: the change's repos sync to the node
# (zuul-jobs roles) and the job's logs upload to the logs container, so every
# build carries a log_url.
- job:
    name: base
    parent: null
    pre-run: playbooks/base/pre.yaml
    post-run: playbooks/base/post-logs.yaml
    roles:
      - zuul: zuul/zuul-jobs
    nodeset:
      nodes:
        - name: test-node
          label: test-node
