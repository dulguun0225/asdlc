# The static test node. bootstrap.mjs replaces @NODE_HOST_KEY@ with the key
# the node container generated at first start before pushing this seed.
- image:
    name: test-node
    type: cloud

- flavor:
    name: static

- label:
    name: test-node
    image: test-node
    flavor: static

- section:
    name: static
    connection: static
    flavors:
      - name: static

- provider:
    name: static-main
    section: static
    nodes:
      - name: node
        label: test-node
        connection-port: 22
        host-key: "@NODE_HOST_KEY@"
    labels:
      - name: test-node
    images:
      - name: test-node
        python-path: /usr/bin/python3
        username: root
