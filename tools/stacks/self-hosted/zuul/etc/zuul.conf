# Zuul service configuration, shape of the official quickstart's zuul.conf.
# Secrets are never written here: values interpolate from ZUUL_*-prefixed
# environment variables (Zuul configuration docs), which compose loads from
# the generated .secrets/stack.env.

[zookeeper]
hosts=zk:2281
tls_cert=/var/certs/certs/client.pem
tls_key=/var/certs/keys/clientkey.pem
tls_ca=/var/certs/certs/cacert.pem

[keystore]
password=%(ZUUL_KEYSTORE_PASSWORD)s

[scheduler]
tenant_config=/etc/zuul/main.yaml

[connection "gerrit"]
driver=gerrit
server=gerrit
sshkey=/var/ssh/zuul
user=zuul
password=%(ZUUL_GERRIT_PASSWORD)s
baseurl=http://gerrit:8080
auth_type=basic

[database]
dburi=mariadb+pymysql://zuul:%(ZUUL_MYSQL_PASSWORD)s@mariadb/zuul

[web]
listen_address=0.0.0.0
port=9000
root=http://localhost:9000

[executor]
private_key_file=/var/ssh/nodepool
default_username=root
# The pinned cosign/oras binaries (compose mounts .harbor/bin here). The
# executor's bubblewrap binds nothing extra by default; trusted-only keeps
# the tools out of untrusted (proposed-change) playbook contexts.
trusted_ro_paths=/opt/stack-bin
# The base job's log upload target (quickstart jobs2); same bubblewrap rule,
# write side.
trusted_rw_paths=/srv/static/logs

[webclient]
url=http://localhost:9000
verify_ssl=false

[connection "static"]
driver=static

# Read-only source for the upstream zuul-jobs roles the base job uses
# (quickstart jobs2 shape).
[connection "opendev.org"]
driver=git
baseurl=https://opendev.org
